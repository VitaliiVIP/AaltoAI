name: Publish images

# Pushes ghcr.io/<owner>/recourse-web and recourse-api. The VPS cron
# (vps_deployment/scripts/update-deployment.sh) pulls :latest on its next run.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: recourse-web
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: recourse-api
            context: backend
            dockerfile: backend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR repository names must be lowercase, but a GitHub account name can
      # carry capitals, which fails the push with "must be lowercase".
      - id: ns
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.ns.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
