# Employer-authored job template.
#
# Scoring is a 100-point budget: `points` is what a criterion is worth at full
# marks and the column adds up to 100, so a score reads as a percentage and the
# threshold is a share of the job rather than a magic number. `cap` is how many
# solver steps count as full marks. Causal constraints are not here -- they are
# facts about the world and live in the manifest.
job_id: backend_engineer
title: Backend Software Engineer
family: software_engineering
manifest: software_engineering.json
version: backend-engineer-v2
knockouts: [skills.python.held == true, experience.software_months >= 12, education.highest_level >= bsc]
score:
  experience.backend_months: {points: 32, cap: 8}
  skills.python.months: {points: 16, cap: 8}
  skills.kubernetes.held: {points: 11}
  project_counts_by_topic.microservices: {points: 10, cap: 2}
  derived.cloud_platform_held: {points: 9}
  derived.ci_cd_held: {points: 5}
  education.highest_level: {points: 6, cap: 3}
  skills.docker.held: {points: 4}
  derived.iac_held: {points: 4}
  derived.sql_held: {points: 3}
mode:
  A: {threshold: 80, margin_eps: 0, weight_shrink_rho: 0}
  B: {slots_N: 3, margin_eps: 0, weight_shrink_rho: 0}
k_routes: 3
sparsity_lambda: 1
