server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are client-side routes, not 404s. /api never
    # reaches this container — Caddy peels the prefix off and routes elsewhere.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's bundles are content-hashed, so they can be cached forever; index.html
    # must not be, or a deploy leaves browsers pointing at bundles that are gone.
    # Matched by extension rather than by /assets/ prefix, because the demo CVs in
    # public/assets/cvs/ land there too and those do get replaced under a stable name.
    location ~* \.(js|css|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
